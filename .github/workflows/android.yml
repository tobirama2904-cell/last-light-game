name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Build web game (single file)
        run: npm run build

      - name: Copy game into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp dist/index.html android/app/src/main/assets/index.html
          ls -lh android/app/src/main/assets/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # пустой список: пакет 'tools' из умолчаний больше не существует в репозитории Google
          packages: ""

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/LastLight.apk
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastLight-APK
          path: out/LastLight.apk
          retention-days: 90

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: LAST LIGHT — APK (последняя сборка)
          body: |
            Установочный файл игры для Android (минимум Android 8.0).

            1. Скачай **LastLight.apk** ниже.
            2. На телефоне разреши установку из неизвестных источников.
            3. Открой файл и установи.

            Игра работает офлайн, весь мир и звук генерируются на устройстве.
          files: out/LastLight.apk
          make_latest: true
